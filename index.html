<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- GitHub Pages 無法設定 HTTP header，以 meta CSP 限制腳本與連線來源 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://accounts.google.com/gsi/client;
    style-src 'self' https://accounts.google.com/gsi/style;
    frame-src https://accounts.google.com/gsi/;
    connect-src 'self' https://accounts.google.com/gsi/ https://sheets.googleapis.com https://www.googleapis.com https://api.open-meteo.com;
    img-src 'self' data: https://headack.goatcounter.com;
    base-uri 'self';
    form-action 'self';
  ">
  <meta name="referrer" content="no-referrer">
  <title>Headack — Free headache diary｜免費頭痛日記</title>
  <meta name="description" content="Free headache diary: log attacks, pain, medication and triggers in a few taps, see monthly trends and print a summary for your doctor. Your data stays in your own Google Drive. 免費頭痛日記：幾下點選就能記錄頭痛、疼痛程度、用藥與誘因，查看每月趨勢並列印看診摘要。資料只存在你自己的 Google 雲端硬碟。">
  <link rel="canonical" href="https://bear1110.github.io/headack/">
  <!-- 分享預覽（LINE、Facebook、X 等） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Headack">
  <meta property="og:title" content="Headack — Free headache diary｜免費頭痛日記">
  <meta property="og:description" content="Free headache diary: log attacks, pain, medication and triggers in a few taps, see monthly trends and print a summary for your doctor. Your data stays in your own Google Drive.">
  <meta property="og:url" content="https://bear1110.github.io/headack/">
  <meta property="og:image" content="https://bear1110.github.io/headack/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Headack bear logo">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 結構化資料（只是資料區塊，不會被執行，不受 CSP script-src 限制） -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Headack",
    "url": "https://bear1110.github.io/headack/",
    "description": "Free headache diary: log attacks, pain, medication and triggers in a few taps, see monthly trends and print a summary for your doctor. Your data stays in your own Google Drive.",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Any (web browser)",
    "inLanguage": ["zh-TW", "zh-CN", "en", "ja"],
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "image": "https://bear1110.github.io/headack/icons/og-image.png"
  }
  </script>
  <meta name="theme-color" content="#3b5bdb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script id="gis" src="https://accounts.google.com/gsi/client" async></script>
  <script type="module" src="js/app.js"></script>
</head>
<!-- data-view 控制目前顯示的分頁；版面差異（手機 / 桌機）全部由 CSS 處理 -->
<body data-view="log">
  <header class="topbar">
    <h1 class="brand"><img src="icons/logo.svg" alt="" width="34" height="34"><span>headack</span></h1>
    <!-- 手機：固定在畫面底部的分頁列；桌機：標題列中的分頁 -->
    <nav class="nav">
      <button data-view="log" class="active"><span class="nav-icon" data-icon="log"></span><span data-i18n="nav.log">Log</span></button>
      <button data-view="list"><span class="nav-icon" data-icon="list"></span><span data-i18n="nav.list">History</span></button>
      <button data-view="calendar"><span class="nav-icon" data-icon="calendar"></span><span data-i18n="nav.calendar">Calendar</span></button>
      <button data-view="stats"><span class="nav-icon" data-icon="stats"></span><span data-i18n="nav.stats">Stats</span></button>
      <button data-view="settings"><span class="nav-icon" data-icon="settings"></span><span data-i18n="nav.settings">Settings</span></button>
    </nav>
    <div class="top-actions">
      <!-- 語言選單放在標題列，第一次來的人不必進設定就能切換 -->
      <!-- 加到主畫面／安裝：已安裝（從主畫面開啟）時隱藏 -->
      <button type="button" id="btn-install" class="icon-btn-top" hidden data-i18n-attr="aria-label:install.button,title:install.button"><span data-icon="install"></span></button>
      <label class="lang-picker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        <select id="lang-select" data-i18n-attr="aria-label:settings.language,title:settings.language"></select>
      </label>
    <div class="sync">
      <span id="sync-status" class="sync-status"></span>
      <button id="btn-signin" class="btn small" hidden data-i18n="auth.signIn">Sign in with Google</button>
      <button id="btn-sync" class="btn small ghost" hidden data-i18n="sync.now">Sync now</button>
    </div>
    </div>
  </header>

  <p id="banner" class="banner" hidden></p>
  <div id="demo-banner" class="demo-banner" hidden>
    <span data-i18n="demo.banner"></span>
    <button type="button" id="btn-demo-exit" class="btn small" data-i18n="demo.exit"></button>
  </div>

  <main>
    <noscript><p class="card">Headack is a free headache diary that stores your entries in your own Google Drive. Please enable JavaScript to use it.<br>Headack 是免費的頭痛日記，紀錄存在你自己的 Google 雲端硬碟。請啟用 JavaScript 以使用本網站。</p></noscript>
    <!-- 記錄：手機的首頁；桌機時與列表並排 -->
    <section id="view-log" class="view">
      <button id="btn-quick-start" class="btn huge">
        <span data-i18n="log.start">Headache started</span>
        <small data-i18n="log.startHint"></small>
      </button>
      <div id="ongoing" class="ongoing-list"></div>
      <p id="home-summary" class="home-summary" hidden></p>
      <!-- 有紀錄但還沒登入：明確說明後果，並提供登入備份 -->
      <div id="backup-card" class="card backup-card" hidden>
        <h2 class="card-title"><span data-icon="cloudOff"></span><span data-i18n="backup.title"></span></h2>
        <p id="backup-body"></p>
        <button type="button" id="btn-backup" class="btn" data-i18n="backup.button"></button>
      </div>
      <p id="tagline" class="tagline" hidden data-i18n="about.tagline"></p>
      <button type="button" id="btn-try-demo" class="btn ghost wide" hidden data-i18n="demo.try"></button>
      <div id="weather-prompt" class="card weather-prompt" hidden>
        <h2 data-i18n="weather.promptTitle"></h2>
        <p class="muted small" data-i18n="weather.promptBody"></p>
        <div class="actions">
          <button type="button" id="btn-weather-on" class="btn" data-i18n="weather.enable"></button>
          <button type="button" id="btn-weather-off" class="btn ghost" data-i18n="weather.dismiss"></button>
        </div>
      </div>
      <button id="btn-full" class="btn ghost wide" data-i18n="log.full">Add full entry</button>
    </section>

    <!-- 列表 -->
    <section id="view-list" class="view">
      <h2 class="view-title" data-i18n="nav.list"></h2>
      <ul id="record-list" class="record-list"></ul>
    </section>

    <!-- 日曆：最近 3 / 6 個月 -->
    <section id="view-calendar" class="view">
      <div class="cal-toolbar">
        <div class="seg cal-range" role="radiogroup" data-i18n-attr="aria-label:cal.range">
          <button type="button" role="radio" data-months="3" data-i18n="cal.range3"></button>
          <button type="button" role="radio" data-months="6" data-i18n="cal.range6"></button>
        </div>
        <div class="cal-legend" aria-hidden="true">
          <span><i class="sw i2"></i><span data-i18n="cal.legendMild"></span></span>
          <span><i class="sw i5"></i><i class="sw i7"></i><i class="sw i9"></i><span data-i18n="cal.legendSevere"></span></span>
          <span><i class="sw no-intensity"></i><span data-i18n="cal.legendUnknown"></span></span>
          <span><i class="dot"></i><span data-i18n="cal.meds"></span></span>
        </div>
      </div>
      <div id="cal-pager" class="cal-pager"></div>
      <div id="calendar-months" class="cal-months"></div>
    </section>

    <!-- 統計 -->
    <section id="view-stats" class="view"></section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <!-- 帳號與同步 -->
      <div class="card">
        <h2 class="card-title"><span data-icon="user"></span><span data-i18n="settings.account"></span></h2>
        <p id="account-email" class="muted"></p>
        <p><a id="sheet-link" href="#" target="_blank" rel="noopener" hidden data-i18n="settings.openSheet"></a></p>
        <button id="btn-signout" class="btn ghost small" hidden data-i18n="auth.signOut"></button>
      </div>

      <!-- 偏好 -->
      <h3 class="settings-group" data-i18n="settings.groupPrefs"></h3>
      <div class="card">
        <h2 class="card-title"><span data-icon="weather"></span><span data-i18n="weather.title"></span></h2>
        <p class="small" data-i18n="weather.why"></p>
        <label class="switch-row">
          <input type="checkbox" id="weather-toggle">
          <span data-i18n="weather.setting"></span>
        </label>
        <p class="muted small" data-i18n="weather.promptBody"></p>
        <p class="muted small"><a href="https://open-meteo.com/" target="_blank" rel="noopener" data-i18n="weather.credit"></a></p>
      </div>

      <!-- 資料 -->
      <h3 class="settings-group" data-i18n="settings.groupData"></h3>
      <div class="card">
        <h2 class="card-title"><span data-icon="importIcon"></span><span data-i18n="import.title"></span></h2>
        <p class="muted small" data-i18n="import.desc"></p>
        <button id="btn-import" class="btn ghost" data-i18n="import.title"></button>
      </div>
      <div class="card">
        <h2 class="card-title"><span data-icon="exportIcon"></span><span data-i18n="export.title"></span></h2>
        <p class="muted small" data-i18n="export.desc"></p>
        <button id="btn-export" class="btn ghost" data-i18n="export.button"></button>
      </div>

      <!-- 其他 -->
      <h3 class="settings-group" data-i18n="settings.groupMore"></h3>
      <div class="card">
        <h2 class="card-title"><span data-icon="demo"></span><span data-i18n="demo.title"></span></h2>
        <p class="muted small" data-i18n="demo.desc"></p>
        <button type="button" id="btn-demo" class="btn ghost"></button>
      </div>
      <div class="card">
        <h2 class="card-title"><span data-icon="info"></span><span data-i18n="settings.groupAbout"></span></h2>
        <p><a href="faq.html" data-i18n="footer.faq"></a></p>
        <p><a href="privacy.html" data-i18n="settings.privacy"></a></p>
        <p><a href="terms.html" data-i18n="footer.terms"></a></p>
        <p><a id="source-link" href="https://github.com/Bear1110/headack" target="_blank" rel="noopener" data-i18n="settings.source"></a></p>
        <p class="muted small" data-i18n="settings.languageHelp"></p>
        <p class="muted small" id="app-version"></p>
      </div>
      <div class="card danger-zone">
        <h2 class="card-title"><span data-icon="alert"></span><span data-i18n="danger.title"></span></h2>
        <p class="muted small" data-i18n="danger.clearDesc"></p>
        <button type="button" id="btn-clear" class="btn danger ghost" data-i18n="danger.clear"></button>
      </div>
    </section>

    <footer class="site-footer">
      <p class="disclaimer" data-i18n="disclaimer"></p>
      <nav><a href="privacy.html" data-i18n="settings.privacy"></a> · <a href="terms.html" data-i18n="footer.terms"></a> · <a href="faq.html" data-i18n="footer.faq"></a></nav>
      <p id="copyright"></p>
      <p id="footer-version" class="footer-version"></p>
    </footer>
  </main>

  <!-- 手機在列表、統計頁也能一鍵新增 -->
  <button id="fab" class="fab" data-i18n-attr="aria-label:nav.add,title:nav.add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </button>

  <!-- 新增 / 編輯表單：手機為全螢幕，桌機為置中對話框 -->
  <dialog id="record-dialog">
    <form id="record-form" method="dialog">
      <div class="dialog-body">
        <h2 id="form-title"></h2>
        <div class="row">
          <label class="field"><span data-i18n="form.start"></span><input type="datetime-local" name="start" required></label>
          <label class="field"><span data-i18n="form.end"></span><input type="datetime-local" name="end"></label>
        </div>
        <label class="field">
          <span><span data-i18n="form.intensity"></span> <strong><output id="intensity-out">5</output>/10</strong></span>
          <input type="range" name="intensity" min="0" max="10" step="1" value="5">
        </label>
        <fieldset class="field">
          <legend data-i18n="form.type"></legend>
          <p class="muted small hint" data-i18n="form.typeHint"></p>
          <div id="type-options" class="chips"></div>
        </fieldset>
        <fieldset class="field"><legend data-i18n="form.locations"></legend><div id="head-map"></div></fieldset>
        <fieldset class="field"><legend data-i18n="form.painQuality"></legend><div id="pain-quality-options" class="chips"></div></fieldset>
        <fieldset class="field">
          <legend data-i18n="form.aura"></legend>
          <p class="muted small hint" data-i18n="form.auraHint"></p>
          <div id="aura-options" class="chips"></div>
          <p id="aura-warning" class="warning small" role="alert" hidden data-i18n="form.auraWarning"></p>
        </fieldset>
        <fieldset class="field"><legend data-i18n="form.symptoms"></legend><div id="symptoms-options" class="chips"></div></fieldset>
        <fieldset class="field"><legend data-i18n="form.meds"></legend><div id="med-editor" class="med-editor"></div></fieldset>
        <fieldset class="field"><legend data-i18n="form.medEffect"></legend><div id="effect-options" class="chips"></div></fieldset>
        <fieldset class="field"><legend data-i18n="form.triggers"></legend><div id="triggers-options" class="chips"></div></fieldset>
        <label class="field"><span data-i18n="form.notes"></span><textarea name="notes" rows="3"></textarea></label>
        <p id="form-weather" class="muted small weather-line" hidden></p>
        <p id="form-error" class="error" hidden></p>
      </div>
      <div class="dialog-actions">
        <button type="button" id="btn-delete" class="btn danger ghost" data-i18n="form.delete"></button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel" class="btn ghost" data-i18n="form.cancel"></button>
        <button type="submit" class="btn" data-i18n="form.save"></button>
      </div>
    </form>
  </dialog>

  <!-- 匯入：AI 整理 → 貼上 → 預覽 → 匯入 -->
  <dialog id="import-dialog">
    <form id="import-form" method="dialog">
      <div class="dialog-body">
        <h2 data-i18n="import.title"></h2>
        <p class="muted small" data-i18n="import.privacy"></p>

        <p class="step" data-i18n="import.step1"></p>
        <div class="ai-buttons">
          <a id="ai-chatgpt" class="btn ghost" target="_blank" rel="noopener noreferrer" data-i18n="import.openChatgpt"></a>
          <a id="ai-claude" class="btn ghost" target="_blank" rel="noopener noreferrer" data-i18n="import.openClaude"></a>
          <button type="button" id="btn-copy-prompt" class="btn ghost" data-i18n="import.copyPrompt"></button>
        </div>

        <p class="step" data-i18n="import.step2"></p>
        <textarea id="import-text" rows="6" data-i18n-attr="placeholder:import.placeholder"></textarea>
        <label class="file-pick">
          <span data-i18n="import.file"></span>
          <input type="file" id="import-file" accept=".json,application/json,text/plain">
        </label>
        <div id="import-preview" class="import-preview"></div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="btn-import-close" class="btn ghost" data-i18n="import.close"></button>
        <span class="spacer"></span>
        <button type="submit" id="btn-import-confirm" class="btn" disabled></button>
      </div>
    </form>
  </dialog>

  <!-- 發作當下的快速問答（內容由 quickflow.js 產生） -->
  <dialog id="quick-dialog" class="quick-dialog"></dialog>

  <!-- AI 分析：選問題與筆數，複製後開啟 AI -->
  <dialog id="ai-dialog">
    <form id="ai-form" method="dialog">
      <div class="dialog-body">
        <h2 data-i18n="ai.title"></h2>
        <p id="ai-privacy" class="warning small"></p>
        <fieldset class="field"><legend data-i18n="ai.question"></legend><div id="ai-presets" class="chips"></div></fieldset>
        <fieldset class="field"><legend data-i18n="ai.count"></legend><div id="ai-counts" class="chips"></div></fieldset>
        <label class="switch-row"><input type="checkbox" id="ai-notes" checked><span data-i18n="ai.notes"></span></label>
        <div class="ai-buttons">
          <a id="ai-open-chatgpt" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="import.openChatgpt"></a>
          <a id="ai-open-claude" class="btn" target="_blank" rel="noopener noreferrer" data-i18n="import.openClaude"></a>
          <button type="button" id="ai-copy" class="btn ghost" data-i18n="ai.copy"></button>
        </div>
        <p id="ai-hint" class="muted small"></p>
        <details class="table-view"><summary data-i18n="ai.preview"></summary><pre id="ai-preview" class="ai-preview"></pre></details>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="submit" class="btn ghost" data-i18n="import.close"></button>
      </div>
    </form>
  </dialog>

  <!-- 加到主畫面的說明（瀏覽器不支援直接安裝時） -->
  <dialog id="install-dialog" class="confirm-dialog">
    <form method="dialog">
      <div class="dialog-body">
        <h2 data-i18n="install.title"></h2>
        <ol id="install-steps" class="install-steps"></ol>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="submit" class="btn" data-i18n="import.close"></button>
      </div>
    </form>
  </dialog>

  <!-- 清空所有紀錄：需輸入確認文字 -->
  <dialog id="clear-dialog" class="confirm-dialog">
    <form id="clear-form" method="dialog">
      <div class="dialog-body">
        <h2 data-i18n="clear.title"></h2>
        <p id="clear-body"></p>
        <p id="clear-restore" class="warning small"></p>
        <label class="field">
          <span id="clear-hint"></span>
          <input type="text" id="clear-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <p id="clear-error" class="error" hidden></p>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" id="btn-clear-cancel" class="btn ghost" data-i18n="form.cancel"></button>
        <button type="submit" id="btn-clear-confirm" class="btn danger-solid" disabled data-i18n="clear.confirm"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!-- 瀏覽量計數（GoatCounter）：只是一張 1×1 圖片，不執行第三方程式碼、不設 Cookie、不含任何紀錄資料 -->
  <img class="counter" src="https://headack.goatcounter.com/count?p=/&amp;t=Headack" alt="" width="1" height="1" referrerpolicy="no-referrer">
</body>
</html>
